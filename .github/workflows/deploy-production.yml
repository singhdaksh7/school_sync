name: Deploy Production

# Main is the production source of truth. The workflow remains inert until
# PRODUCTION_BUILD_ENABLED is set after the build role exists. Deployment
# remains independently inert until PRODUCTION_DEPLOY_ENABLED is explicitly
# set after the production stack/deploy role have been created and tested.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Default (workflow-level) permissions — each job below narrows/repeats
# this explicitly. Only the two jobs in THIS workflow ever request
# `id-token: write`; ci.yml (PRs/pushes) never does.
permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "928805968612"
  ECR_REPOSITORY: schoolsync
  ECS_CLUSTER: schoolsync-production-cluster
  ECS_WEB_SERVICE: schoolsync-production-web
  ECS_WORKER_SERVICE: schoolsync-production-worker
  PRODUCTION_VERIFY_URL: ${{ vars.PRODUCTION_VERIFY_URL }}

jobs:
  # ── Build & scan: production-build OIDC role only. Push/scan-read on the
  #    existing ECR repository — nothing else. ──────────────────────────────
  build-and-scan:
    name: Build, push, scan
    if: vars.PRODUCTION_BUILD_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: schoolsync-production-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ github.sha }}
      image_digest: ${{ steps.scan.outputs.digest }}
      scan_critical: ${{ steps.scan.outputs.critical }}
      scan_high: ${{ steps.scan.outputs.high }}

    steps:
      - name: Checkout (exact commit on main)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Assume the production-build OIDC role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.PRODUCTION_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify assumed-role AWS account is exactly the expected account
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account_id" != "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Assumed-role account ($account_id) does not match the expected SchoolSync production account ($AWS_ACCOUNT_ID). Aborting before any ECR push."
            exit 1
          fi
          echo "Confirmed AWS account: $account_id"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Single linux/amd64 image, tagged ONLY with the full commit SHA
      # (never `latest`). provenance/sbom disabled -> a plain Docker v2
      # manifest (not an OCI image index), matching the production build
      # path in Dockerfile exactly (same file, same default NODE_IMAGE arg).
      - name: Build and push image (tag = commit SHA only)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Reuses the EXACT same scan-gate helper the local operator flow uses
      # (infra/scripts/common.ps1 Assert-EcrImageApproved) — single source of
      # truth for "COMPLETE scan, zero CRITICAL/HIGH" rather than a second,
      # divergent implementation in this workflow. No --profile is passed
      # (AWS_PROFILE is never set on this runner), so Get-AwsCliProfileArgs
      # resolves to the OIDC-assumed role's environment credentials.
      - name: Wait for ECR scan completion; fail on CRITICAL/HIGH findings
        id: scan
        shell: pwsh
        run: |
          . ./infra/scripts/common.ps1
          $result = Assert-EcrImageApproved -RepositoryName "${{ env.ECR_REPOSITORY }}" -ImageTag "${{ github.sha }}" -TimeoutSeconds 300
          "digest=$($result.Digest)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "critical=$($result.Critical)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "high=$($result.High)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "medium=$($result.Medium)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "low=$($result.Low)"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Record build summary (no credentials, no tokens)
        run: |
          {
            echo "### Build & scan"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image tag (commit SHA) | \`${{ github.sha }}\` |"
            echo "| Image digest | \`${{ steps.scan.outputs.digest }}\` |"
            echo "| Scan CRITICAL | ${{ steps.scan.outputs.critical }} |"
            echo "| Scan HIGH | ${{ steps.scan.outputs.high }} |"
            echo "| Scan MEDIUM | ${{ steps.scan.outputs.medium }} |"
            echo "| Scan LOW | ${{ steps.scan.outputs.low }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Protected deployment: production-deploy OIDC role only, gated by the
  #    `production` GitHub Environment (required reviewer, branch restriction —
  #    see the repo-root runbook). Never cancelled mid-flight. ──────────────
  deploy:
    name: Deploy to production
    needs: build-and-scan
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: schoolsync-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout (exact commit on main)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Assume the production-deploy OIDC role (GitHub Environment subject)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reverify AWS account/region and the build job's scan result
        shell: pwsh
        run: |
          . ./infra/scripts/common.ps1
          $identity = aws sts get-caller-identity --output json | ConvertFrom-Json
          if ($identity.Account -ne "${{ env.AWS_ACCOUNT_ID }}") {
              Write-Error "Assumed production-deploy role resolves to account $($identity.Account), expected ${{ env.AWS_ACCOUNT_ID }}. Aborting before any ECS mutation."
              exit 1
          }
          if ("${{ env.AWS_REGION }}" -ne "ap-south-1") {
              Write-Error "Unexpected AWS_REGION — expected ap-south-1."
              exit 1
          }
          Write-Host "Confirmed account $($identity.Account) / region ${{ env.AWS_REGION }}"

          # Reverify the EXACT image digest + scan result at deploy time —
          # never trust the build job's recorded output without re-checking,
          # in case anything in ECR changed between build and deploy.
          $result = Assert-EcrImageApproved -RepositoryName "${{ env.ECR_REPOSITORY }}" -ImageTag "${{ needs.build-and-scan.outputs.image_tag }}" -TimeoutSeconds 60
          $buildDigest = "${{ needs.build-and-scan.outputs.image_digest }}"
          if ($result.Digest -ne $buildDigest) {
              Write-Error "Image digest changed between build ($buildDigest) and deploy ($($result.Digest)) — refusing to deploy a moving target."
              exit 1
          }
          Write-Host "Reverified digest matches build job: $($result.Digest)"

      # Non-secret Terraform backend/tfvars configuration for THIS run —
      # infra/terraform/backend.hcl and terraform.tfvars are gitignored
      # (never committed; contain no secrets, only bucket/table/domain
      # names identical to what the schoolsync-admin operator already uses
      # for manual applies — see the repo-root runbook for how these two
      # Environment variables are populated). Never sourced from a secret,
      # and never printed beyond what `terraform plan` itself shows.
      - name: Reconstruct non-secret Terraform backend/tfvars config
        working-directory: infra/terraform
        run: |
          cat > backend.hcl <<'EOF'
          ${{ vars.TF_BACKEND_HCL }}
          EOF
          cat > terraform.tfvars <<'EOF'
          ${{ vars.TF_TFVARS }}
          EOF

      - name: Terraform no-change gate + coordinated ECS rollout (native script, unchanged order)
        shell: pwsh
        run: |
          ./infra/scripts/deploy-staging.ps1 `
            -ExpectedAccountId "${{ env.AWS_ACCOUNT_ID }}" `
            -ImageTag "${{ needs.build-and-scan.outputs.image_tag }}" `
            -DeploymentEnvironment production `
            -AutoApprove `
            -UseOidcCredentials `
            -RequireTerraformNoChanges

      - name: Post-deploy verification (digest, ALB health, logs, follow-up no-change plan)
        id: verify
        shell: pwsh
        run: |
          . ./infra/scripts/common.ps1
          $profileArgs = Get-AwsCliProfileArgs
          $failed = $false

          Write-Step "Verifying web/worker services are ACTIVE with running=desired and pending=0"
          $services = aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_WEB_SERVICE $env:ECS_WORKER_SERVICE @profileArgs --region $env:AWS_REGION --output json | ConvertFrom-Json
          foreach ($svc in $services.services) {
              $shape = "$($svc.desiredCount)/$($svc.runningCount)/$($svc.pendingCount)"
              if ($svc.status -ne "ACTIVE" -or $svc.desiredCount -lt 1 -or $svc.runningCount -ne $svc.desiredCount -or $svc.pendingCount -ne 0) {
                  Write-Fail "$($svc.serviceName) is not ACTIVE/stable (got $shape, status=$($svc.status))"
                  $failed = $true
              } else {
                  Write-Success "$($svc.serviceName) stable at $shape"
              }
          }

          Write-Step "Verifying running containers use the expected commit image tag AND digest"
          $expectedImage = "${{ needs.build-and-scan.outputs.image_tag }}"
          $expectedDigest = "${{ needs.build-and-scan.outputs.image_digest }}"
          if ([string]::IsNullOrWhiteSpace($expectedDigest)) {
              Write-Fail "build-and-scan.outputs.image_digest is empty — refusing to verify against a blank digest"
              $failed = $true
          }
          foreach ($svc in $services.services) {
              $taskArns = (aws ecs list-tasks --cluster $env:ECS_CLUSTER --service-name $svc.serviceName @profileArgs --region $env:AWS_REGION --output json | ConvertFrom-Json).taskArns
              if (-not $taskArns -or $taskArns.Count -eq 0) {
                  Write-Fail "$($svc.serviceName): no running tasks found"
                  $failed = $true
                  continue
              }
              $tasks = aws ecs describe-tasks --cluster $env:ECS_CLUSTER --tasks $taskArns @profileArgs --region $env:AWS_REGION --output json | ConvertFrom-Json
              foreach ($task in $tasks.tasks) {
                  foreach ($container in $task.containers) {
                      # Tag match alone is NOT sufficient proof of the running image — a
                      # tag can be re-pushed/overwritten in ECR after this workflow
                      # recorded its digest. The digest is the only value that
                      # actually identifies the exact image bytes running right now,
                      # so both must match; either mismatch fails the deployment.
                      $tagOk = $container.image -match [regex]::Escape($expectedImage)
                      $digestOk = -not [string]::IsNullOrWhiteSpace($container.imageDigest) -and $container.imageDigest -eq $expectedDigest
                      if (-not $tagOk -or -not $digestOk) {
                          Write-Fail "$($svc.serviceName) container $($container.name) mismatch — image='$($container.image)' (expected tag $expectedImage), imageDigest='$($container.imageDigest)' (expected $expectedDigest)"
                          $failed = $true
                      } else {
                          Write-Success "$($svc.serviceName) container $($container.name) running expected image+digest ($($container.image), $($container.imageDigest))"
                      }
                  }
              }
          }

          Write-Step "Verifying ALB target health"
          # Fail closed: an unresolvable target group or a failed
          # describe-target-health call means we cannot prove the deployment
          # is healthy, which is exactly the situation this check exists to
          # catch — it must never be treated as "nothing to check".
          $tgArn = $null
          try {
              $tgArn = (aws elbv2 describe-target-groups --names "schoolsync-production-web-tg" @profileArgs --region $env:AWS_REGION --output json 2>$null | ConvertFrom-Json).TargetGroups[0].TargetGroupArn
          } catch {
              $tgArn = $null
          }
          if (-not $tgArn) {
              Write-Fail "Could not resolve the production web target group (schoolsync-production-web-tg) — failing rather than skipping ALB health verification"
              $failed = $true
          } else {
              $health = $null
              try {
                  $health = aws elbv2 describe-target-health --target-group-arn $tgArn @profileArgs --region $env:AWS_REGION --output json | ConvertFrom-Json
              } catch {
                  $health = $null
              }
              if (-not $health -or -not $health.TargetHealthDescriptions) {
                  Write-Fail "describe-target-health failed or returned no data for target group $tgArn — failing rather than skipping ALB health verification"
                  $failed = $true
              } else {
                  $healthy = $health.TargetHealthDescriptions | Where-Object { $_.TargetHealth.State -eq "healthy" }
                  if (-not $healthy -or $healthy.Count -eq 0) {
                      Write-Fail "No healthy ALB target found for the web target group"
                      $failed = $true
                  } else {
                      Write-Success "$($healthy.Count) healthy ALB target(s)"
                  }
              }
          }

          Write-Step "Scanning recent web/worker logs for new TLS / redirect / JSON-parse errors"
          $sinceMs = [DateTimeOffset]::UtcNow.AddMinutes(-15).ToUnixTimeMilliseconds()
          $errorPattern = "ERR_TLS|CERT_|certificate verify failed|ECONNRESET|too many redirects|ERR_TOO_MANY_REDIRECTS|Unexpected token|SyntaxError.*JSON|is not valid JSON"
          foreach ($logGroup in @("/ecs/schoolsync-production/web", "/ecs/schoolsync-production/worker")) {
              $events = aws logs filter-log-events --log-group-name $logGroup --start-time $sinceMs @profileArgs --region $env:AWS_REGION --output json 2>$null | ConvertFrom-Json
              if ($events -and $events.events) {
                  $matches = $events.events | Where-Object { $_.message -match $errorPattern }
                  if ($matches -and $matches.Count -gt 0) {
                      Write-Fail "$($matches.Count) matching error(s) found in $logGroup since deploy start"
                      $failed = $true
                  } else {
                      Write-Success "$logGroup — no matching errors in the last 15 minutes"
                  }
              }
          }

          if ($failed) {
              Write-Fail "Post-deploy verification FAILED — see above."
              exit 1
          }
          Write-Success "Post-deploy verification passed"

      - name: Verify liveness/readiness over HTTPS (verified TLS, no -k/--insecure)
        run: |
          set -euo pipefail
          if [[ -z "$PRODUCTION_VERIFY_URL" || "$PRODUCTION_VERIFY_URL" != https://* ]]; then
            echo "::error::PRODUCTION_VERIFY_URL must be the Terraform verification_url (https://...), never the still-live Vercel production URL."
            exit 1
          fi
          for path in "/api/health" "/api/health?check=readiness"; do
            code="$(curl --silent --show-error --fail --output /dev/null --write-out '%{http_code}' "${PRODUCTION_VERIFY_URL}${path}")"
            if [ "$code" != "200" ]; then
              echo "::error::GET ${PRODUCTION_VERIFY_URL}${path} returned HTTP $code, expected 200"
              exit 1
            fi
            echo "GET ${PRODUCTION_VERIFY_URL}${path} -> HTTP $code"
          done

      - name: Follow-up Terraform plan must report no changes
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl -input=false
          set +e
          terraform plan -detailed-exitcode -input=false -var-file=terraform.tfvars
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Follow-up plan: No changes. Your infrastructure matches the configuration."
          elif [ "$code" -eq 2 ]; then
            echo "::error::Follow-up Terraform plan reports unexpected drift after deployment."
            exit 1
          else
            echo "::error::Follow-up terraform plan failed (exit $code)."
            exit 1
          fi

      - name: Write sanitized deployment summary
        if: always()
        run: |
          {
            echo "### Production deployment"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image tag (commit SHA) | \`${{ needs.build-and-scan.outputs.image_tag }}\` |"
            echo "| Image digest | \`${{ needs.build-and-scan.outputs.image_digest }}\` |"
            echo "| Scan CRITICAL / HIGH | ${{ needs.build-and-scan.outputs.scan_critical }} / ${{ needs.build-and-scan.outputs.scan_high }} |"
            echo "| Production verification URL | ${{ env.PRODUCTION_VERIFY_URL }} |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            echo "_No secret values, tokens, or Terraform state were printed by this workflow._"
          } >> "$GITHUB_STEP_SUMMARY"
